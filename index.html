<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoeb Khandaker - Portfolio</title>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px; /* ডেস্কটপে সুন্দর রিডেবল সাইজ রাখবে */
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .profile-img-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            background-color: #ffffff;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
        }

        h1 {
            font-size: clamp(22px, 5vw, 28px);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .title {
            color: #38bdf8;
            font-size: clamp(14px, 3vw, 16px);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .institution {
            color: #94a3b8;
            font-size: clamp(12px, 2.5vw, 14px);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .info-group {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: clamp(13px, 2.5vw, 15px);
            color: #cbd5e1;
            word-break: break-word;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-item i {
            color: #38bdf8;
            width: 20px;
            text-align: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .info-item a {
            color: #cbd5e1;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .info-item a:hover {
            color: #38bdf8;
        }

        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .social-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .social-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(56, 189, 248, 0.3);
        }

        .footer-copyright {
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 15px;
            margin-top: 5px;
        }

        /* Responsive design for larger screens */
        @media (min-width: 768px) {
            .card {
                max-width: 550px;
                padding: 45px 35px;
            }
            .profile-img-container {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img-container">
            <img src="shoeb.png" alt="Shoeb Khandaker" class="profile-img">
        </div>

        <h1>Shoeb Khandaker</h1>
        <p class="title">Founder & CEO, Sems Inc.</p>
        <p class="institution">
            Student of CST<br>
            Ahsanullah Institute Of Technology
        </p>

        <div class="info-group">
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>Bhaterchar, Gazaria, Munshiganj</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-phone"></i>
                <a href="tel:+8809638854844">+880 9638-854844</a>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-envelope"></i>
                <a href="mailto:shoeb.sems@gmail.com">shoeb.sems@gmail.com</a>
            </div>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/share/183Fk65Dm2/" target="_blank" class="social-btn" title="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/shoeb_khandaker?stkn=NTNzeW1rMzJmejZ1" target="_blank" class="social-btn" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://github.com/shoeb-khandaker" target="_blank" class="social-btn" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://discord.com/users/1501204716074565662" target="_blank" class="social-btn" title="Discord">
                <i class="fa-brands fa-discord"></i>
            </a>
            <a href="https://t.me/Shoeb_Khandaker" target="_blank" class="social-btn" title="Telegram">
                <i class="fa-brands fa-telegram"></i>
            </a>
        </div>

        <div class="footer-copyright">
            Copyright &copy; Shoeb Khandaker
        </div>
    </div>

</body>
</html>
